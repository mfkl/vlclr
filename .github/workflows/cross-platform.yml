name: Cross-platform

on:
  push:
    branches: [main, "cross-platform/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel
          - name: Windows x64
            os: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Add vswhere to PATH for Native AOT
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        run: dotnet build vlclr.sln -c Release

      - name: Unit tests
        run: dotnet test src/VLCLR.Tests -c Release --no-build

      - name: Install unsquashfs
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: command -v unsquashfs || { sudo apt-get update && sudo apt-get install -y squashfs-tools; }

      - name: Download the VLC 4 nightly
        if: ${{ !cancelled() }}
        run: tests/VlcEndToEnd/download-vlc.sh artifacts/vlc

      - name: Fetch the pinned VLC headers
        if: ${{ !cancelled() }}
        run: tools/VLCLR.CImport/fetch-headers.sh

      - name: Check interop layouts against the pinned VLC headers
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: tests/AbiValidation/verify-vlc-abi.sh artifacts/vlc-headers/include

      - name: Check interop layouts against the pinned VLC headers (MSVC)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: cmd
        run: tests\AbiValidation\verify-vlc-abi.cmd artifacts\vlc-headers\include

      # The toolchain VLC's Windows builds use; MSVC above checks the headers it can parse.
      - name: Install llvm-mingw
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: ./.github/actions/llvm-mingw

      - name: Check interop layouts against the pinned VLC headers (llvm-mingw)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          CC: x86_64-w64-mingw32-clang
        run: tests/AbiValidation/verify-vlc-abi.sh artifacts/vlc-headers/include

      # Compiles tests/InlineParity/native/inline_parity.c against the pinned
      # headers (cl on Windows, cc elsewhere; the fixture finds the compiler)
      # and compares the C# reimplementations of VLC's static inlines with it.
      - name: Inline parity, C# reimplementations against the VLC inline functions
        if: ${{ !cancelled() }}
        run: dotnet test tests/InlineParity -c Release --no-build

      # A failure here, with the pinned step above green, means VLC changed a
      # layout since the pinned commit: a real drift signal. It does not block
      # PRs, except the bump PR from cimport-bump.yml, so VLC moving upstream
      # does not turn unrelated PRs red.
      - name: VLC nightly drift, interop layouts against the nightly headers
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        continue-on-error: ${{ github.event_name == 'pull_request' && github.head_ref != 'cimport/vlc-bump' }}
        run: tests/AbiValidation/verify-vlc-abi.sh artifacts/vlc/include

      - name: VLC nightly drift, interop layouts against the nightly headers (MSVC)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        continue-on-error: ${{ github.event_name == 'pull_request' && github.head_ref != 'cimport/vlc-bump' }}
        shell: cmd
        run: tests\AbiValidation\verify-vlc-abi.cmd artifacts\vlc\include

      - name: VLC nightly drift, interop layouts against the nightly headers (llvm-mingw)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        continue-on-error: ${{ github.event_name == 'pull_request' && github.head_ref != 'cimport/vlc-bump' }}
        env:
          CC: x86_64-w64-mingw32-clang
        run: tests/AbiValidation/verify-vlc-abi.sh artifacts/vlc/include

      - name: Run the plugins in VLC
        if: ${{ !cancelled() }}
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: tests/VlcEndToEnd/run.sh artifacts/vlc/vlc artifacts/vlc-e2e

      - name: Upload logs and snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            artifacts/vlc-e2e/out
            artifacts/vlc-e2e/*.log

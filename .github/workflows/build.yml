name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VLC_SDK_URL: https://artifacts.videolan.org/vlc/nightly-win64-llvm/20260127-0438/vlc-4.0.0-dev-win64-2deb1c14.7z

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download and extract VLC SDK
        run: |
          Invoke-WebRequest -Uri "$env:VLC_SDK_URL" -OutFile vlc.7z
          7z x vlc.7z -ovlc-download
          # Move the inner folder to vlc-sdk
          $innerFolder = Get-ChildItem vlc-download | Select-Object -First 1
          Move-Item $innerFolder.FullName vlc-sdk

      - name: Add vswhere to PATH
        run: |
          $vsWherePath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          echo "$vsWherePath" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Restore dependencies
        run: dotnet restore

      - name: Build VLCLR.Generators
        run: dotnet build src/VLCLR.Generators -c Release

      - name: Build VLCLR framework
        run: dotnet build src/VLCLR -c Release

      - name: Build VideoOverlay sample (Native AOT)
        run: |
          dotnet publish samples/VideoOverlay -c Release -r win-x64
          # List generated files to verify source generator ran
          Write-Host "=== Generated source files ==="
          Get-ChildItem -Recurse samples/VideoOverlay/obj -Filter "*.g.cs" | ForEach-Object { Write-Host $_.FullName }
          # Show the generated entry point code
          $genFile = Get-ChildItem -Recurse samples/VideoOverlay/obj -Filter "VideoOverlayFilter.g.cs" | Select-Object -First 1
          if ($genFile) {
            Write-Host "=== Generated code ==="
            Get-Content $genFile.FullName
          } else {
            Write-Host "WARNING: No generated file found!"
          }

      - name: Run tests
        run: dotnet test src/VLCLR.Tests -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Check VLC API version
        run: |
          Write-Host "=== VLC SDK API Version ==="
          $header = Get-ChildItem -Recurse vlc-sdk -Filter "vlc_plugin.h" | Select-Object -First 1
          if ($header) {
            Write-Host "Found: $($header.FullName)"
            Get-Content $header.FullName | Select-String "VLC_API_VERSION_STRING"
          } else {
            Write-Host "WARNING: vlc_plugin.h not found in vlc-sdk"
            Write-Host "Listing vlc-sdk structure:"
            Get-ChildItem vlc-sdk -Recurse -Directory | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
          }

      - name: Validate managed layouts against VLC headers
        run: |
          $header = Get-ChildItem -Recurse vlc-sdk -Filter "vlc_common.h" | Select-Object -First 1
          if (-not $header) {
            throw "vlc_common.h was not found in the downloaded VLC SDK"
          }
          & tests\AbiValidation\verify-vlc-abi.cmd $header.Directory.FullName
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Deploy plugin to VLC
        run: |
          $pluginSrc = "samples/VideoOverlay/bin/Release/net10.0/win-x64/native/libdotnet_overlay_plugin.dll"
          $pluginDst = "vlc-sdk/plugins/video_filter/"
          New-Item -ItemType Directory -Force -Path $pluginDst
          Copy-Item $pluginSrc $pluginDst
          Write-Host "Plugin deployed to $pluginDst"
          # Remove plugin cache so libvlc rescans plugins directory
          Remove-Item "vlc-sdk/plugins/plugins.dat" -ErrorAction SilentlyContinue

      - name: Verify plugin was built
        run: |
          $plugin = "samples/VideoOverlay/bin/Release/net10.0/win-x64/native/libdotnet_overlay_plugin.dll"
          if (Test-Path $plugin) {
            Write-Host "Plugin built successfully: $plugin"
            Write-Host "Size: $((Get-Item $plugin).Length) bytes"
          } else {
            Write-Host "ERROR: Plugin not found!"
            exit 1
          }

      - name: Run filter integration test
        run: |
          dotnet run --project tests/IntegrationTest -- vlc-sdk "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" 10

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            samples/VideoOverlay/bin/Release/net10.0/win-x64/native/libdotnet_overlay_plugin.dll

name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VLC_NIGHTLY_INDEX: https://artifacts.videolan.org/vlc/nightly-win64/

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download and extract VLC SDK
        run: |
          $ErrorActionPreference = "Stop"

          $nightlyIndex = Invoke-WebRequest -Uri $env:VLC_NIGHTLY_INDEX -UseBasicParsing
          $latestBuild = $nightlyIndex.Links |
            Where-Object { $_.href -match '^\d{8}-\d{4}/$' } |
            Sort-Object href -Descending |
            Select-Object -First 1
          if (-not $latestBuild) {
            throw "No dated VLC nightly directory was found at $env:VLC_NIGHTLY_INDEX"
          }

          $buildUri = [Uri]::new([Uri]$env:VLC_NIGHTLY_INDEX, $latestBuild.href)
          $buildIndex = Invoke-WebRequest -Uri $buildUri -UseBasicParsing
          $archive = $buildIndex.Links |
            Where-Object { $_.href -match '^vlc-4\.0\.0-dev-win64-[0-9a-f]+\.7z$' } |
            Select-Object -First 1
          if (-not $archive) {
            throw "No VLC 4 Windows release archive was found at $buildUri"
          }

          $archiveUri = [Uri]::new($buildUri, $archive.href)
          Write-Host "Downloading VLC SDK from $archiveUri"
          Invoke-WebRequest -Uri $archiveUri -OutFile vlc.7z
          7z x vlc.7z -ovlc-download

          $innerFolder = Get-ChildItem vlc-download -Directory | Select-Object -First 1
          if (-not $innerFolder) {
            throw "The VLC archive did not contain an SDK directory"
          }
          Move-Item $innerFolder.FullName vlc-sdk
          if (-not (Test-Path vlc-sdk/libvlccore.dll)) {
            throw "The extracted VLC SDK does not contain libvlccore.dll"
          }

      - name: Add vswhere to PATH
        run: |
          $vsWherePath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          echo "$vsWherePath" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Restore dependencies
        run: dotnet restore

      - name: Build VLCLR.Generators
        run: dotnet build src/VLCLR.Generators -c Release

      - name: Build VLCLR framework
        run: dotnet build src/VLCLR -c Release

      - name: Build optional ImageSharp integration
        run: dotnet build src/VLCLR.ImageSharp -c Release

      - name: Build VideoOverlay sample (Native AOT)
        run: |
          dotnet publish samples/VideoOverlay -c Release -r win-x64
          # List generated files to verify source generator ran
          Write-Host "=== Generated source files ==="
          Get-ChildItem -Recurse samples/VideoOverlay/obj -Filter "*.g.cs" | ForEach-Object { Write-Host $_.FullName }
          # Show the generated entry point code
          $genFile = Get-ChildItem -Recurse samples/VideoOverlay/obj -Filter "VideoOverlayFilter.g.cs" | Select-Object -First 1
          if ($genFile) {
            Write-Host "=== Generated code ==="
            Get-Content $genFile.FullName
          } else {
            Write-Host "WARNING: No generated file found!"
          }

      - name: Build SubtitleRenderer sample (Native AOT)
        run: dotnet publish samples/SubtitleRenderer -c Release -r win-x64

      - name: Run tests
        run: dotnet test src/VLCLR.Tests -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Check VLC API version
        run: |
          Write-Host "=== VLC SDK API Version ==="
          $header = Get-ChildItem -Recurse vlc-sdk -Filter "vlc_plugin.h" | Select-Object -First 1
          if ($header) {
            Write-Host "Found: $($header.FullName)"
            Get-Content $header.FullName | Select-String "VLC_API_VERSION_STRING"
          } else {
            Write-Host "WARNING: vlc_plugin.h not found in vlc-sdk"
            Write-Host "Listing vlc-sdk structure:"
            Get-ChildItem vlc-sdk -Recurse -Directory | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
          }

      - name: Validate managed layouts against VLC headers
        run: |
          $header = Get-ChildItem -Recurse vlc-sdk -Filter "vlc_common.h" | Select-Object -First 1
          if (-not $header) {
            throw "vlc_common.h was not found in the downloaded VLC SDK"
          }
          & tests\AbiValidation\verify-vlc-abi.cmd $header.Directory.FullName
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Deploy plugins to VLC
        run: |
          $overlaySrc = "samples/VideoOverlay/bin/Release/net10.0/win-x64/native/libdotnet_overlay_plugin.dll"
          $subtitleSrc = "samples/SubtitleRenderer/bin/Release/net10.0/win-x64/native/libdotnet_subtitle_plugin.dll"
          New-Item -ItemType Directory -Force -Path "vlc-sdk/plugins/video_filter/"
          New-Item -ItemType Directory -Force -Path "vlc-sdk/plugins/spu/"
          Copy-Item $overlaySrc "vlc-sdk/plugins/video_filter/"
          Copy-Item $subtitleSrc "vlc-sdk/plugins/spu/"
          Write-Host "Stable plugins deployed to VLC"
          # Remove plugin cache so libvlc rescans plugins directory
          Remove-Item "vlc-sdk/plugins/plugins.dat" -ErrorAction SilentlyContinue

      - name: Verify plugins were built
        run: |
          $plugins = @(
            "samples/VideoOverlay/bin/Release/net10.0/win-x64/native/libdotnet_overlay_plugin.dll",
            "samples/SubtitleRenderer/bin/Release/net10.0/win-x64/native/libdotnet_subtitle_plugin.dll"
          )
          foreach ($plugin in $plugins) {
            if (-not (Test-Path $plugin)) {
              throw "Plugin not found: $plugin"
            }
            Write-Host "Plugin built successfully: $plugin"
            Write-Host "Size: $((Get-Item $plugin).Length) bytes"
          }

      - name: Run filter integration test
        run: |
          dotnet run --project tests/IntegrationTest -- vlc-sdk "https://archive.org/download/BigBuckBunny_328/BigBuckBunny.avi" 10

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            samples/VideoOverlay/bin/Release/net10.0/win-x64/native/libdotnet_overlay_plugin.dll
            samples/SubtitleRenderer/bin/Release/net10.0/win-x64/native/libdotnet_subtitle_plugin.dll
